name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would be published without uploading anything
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Find unpublished targets
        id: plan
        run: python3 .github/scripts/plan_publish.py

      - name: Publish to Modrinth and CurseForge
        if: steps.plan.outputs.modrinth != ''
        env:
          TARGETS: ${{ steps.plan.outputs.modrinth }}
          MODRINTH_TOKEN: ${{ !inputs.dry_run && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ !inputs.dry_run && secrets.CURSEFORGE_TOKEN || '' }}
        run: ./gradlew $(for v in $TARGETS; do printf ':%s:publishModrinth :%s:publishCurseforge ' "$v" "$v"; done)

      - name: Build jars for the GitHub release
        if: steps.plan.outputs.github != '' && !inputs.dry_run
        env:
          TARGETS: ${{ steps.plan.outputs.github }}
        run: ./gradlew $(for v in $TARGETS; do printf ':%s:build ' "$v"; done)

      - name: Upload to the GitHub release
        if: steps.plan.outputs.github != '' && !inputs.dry_run
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          FILES: ${{ steps.plan.outputs.github_files }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          gh release upload "$TAG" $FILES
